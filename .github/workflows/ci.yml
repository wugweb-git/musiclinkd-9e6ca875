name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # Blocking: correctness rules only. Lovable's agent commits straight to main
      # without running Prettier, so gating on formatting would fail every Lovable
      # push and a permanently red check stops being read.
      - name: Lint
        run: bunx eslint . --rule 'prettier/prettier: off'

      # Non-blocking: formatting drift is reported, not enforced. Clear it with
      # `bunx eslint --fix <files>` in a follow-up commit.
      - name: Format check (non-blocking)
        continue-on-error: true
        run: bun run lint

      - name: Build
        run: bun run build
