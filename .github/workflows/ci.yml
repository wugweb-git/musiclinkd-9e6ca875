name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # Blocking: correctness rules only. Lovable's agent commits straight to main
      # without running Prettier, so gating on formatting would fail every Lovable
      # push and a permanently red check stops being read.
      - name: Lint
        # Block scalar: in a plain YAML scalar the ": " inside the rule would parse as a mapping.
        run: |
          bunx eslint . --rule 'prettier/prettier: off'

      # Non-blocking: formatting drift is reported, not enforced. Clear it with
      # `bunx eslint --fix <files>` in a follow-up commit.
      - name: Format check (non-blocking)
        continue-on-error: true
        run: bun run lint

      # No Storybook step: the owner retired Storybook tests (4 Oct 2026); no one runs or writes
      # stories, so a red story gate only hid the real checks.

      # Non-blocking: reports arbitrary text-[Npx]/style={{}} drift in app screens (chart/vendor
      # code excluded). See scripts/check-token-drift.ts and docs/token-scale-spec-2026-09-16.md.
      - name: Token drift report (non-blocking)
        continue-on-error: true
        run: bun run check-token-drift

      - name: Build
        run: bun run build
